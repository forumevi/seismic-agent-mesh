<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEISMIC // Autonomous Agent Shielded Terminal</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #05080e; color: #adbac7; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .badge { padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; letter-spacing: 0.5px; }
    .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 10px #3fb950; margin-right: 8px; }
    .card { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 1.25rem; transition: all 0.3s ease; }
    .card-active { border-color: #3fb950; box-shadow: 0 0 15px rgba(63, 185, 80, 0.15); }
    .btn { padding: 0.8rem 1.4rem; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-family: inherit; transition: all 0.2s; }
    .btn-primary { background: #238636; color: #fff; box-shadow: 0 0 12px rgba(35, 134, 54, 0.4); }
    .btn-primary:hover { background: #2ea043; }
    .btn-key { background: #da3633; color: #fff; box-shadow: 0 0 12px rgba(218, 54, 51, 0.4); }
    .btn-key-active { background: #1f6feb; color: #fff; box-shadow: 0 0 12px rgba(31, 111, 235, 0.4); }
    .guide-step { background: #161b22; border: 1px solid #30363d; padding: 0.8rem 1rem; border-radius: 6px; font-size: 0.8rem; flex: 1; }
    .guide-step.active { border-color: #539bf5; background: #1f6feb15; color: #f0f6fc; }
    .code-block { background: #080c14; padding: 0.6rem; border-radius: 4px; border: 1px solid #21262d; font-size: 0.75rem; color: #d29922; word-break: break-all; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [account, setAccount] = useState(null);
      const [viewingKeyActive, setViewingKeyActive] = useState(false);
      const [isProcessing, setIsProcessing] = useState(false);
      const [statusMsg, setStatusMsg] = useState('System Initialized');
      const [transactions, setTransactions] = useState([]);
      const [logs, setLogs] = useState(['[SYSTEM] Initialized Seismic ZK Telemetry Terminal v2.4...', '[NETWORK] Target RPC: https://testnet-1.seismictest.net/rpc']);

      const addLog = (msg) => {
        setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev.slice(0, 7)]);
      };

      const connectWallet = async () => {
        if (!window.ethereum) return alert('Install Zerion, Rabby or MetaMask!');
        try {
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          setAccount(accounts[0]);
          setStatusMsg('Agent Wallet Synchronized');
          addLog(`Agent Wallet Connected: ${accounts[0]}`);
        } catch (err) {
          setStatusMsg('Wallet Connection Cancelled');
        }
      };

      const executeTx = async () => {
        if (!account) return alert('Please connect your agent wallet first!');
        
        setIsProcessing(true);
        setStatusMsg('Awaiting Cryptographic Signature...');
        addLog('Initiating Autonomous Micropayment Escrow Circuit...');

        try {
          const msg = `Seismic Shielded Agent Protocol:\nContract: 0x71C...A89\nAction: AI Micropayment Escrow\nNonce: ${Math.floor(Math.random()*1000000)}`;
          const txHash = await window.ethereum.request({
            method: 'personal_sign',
            params: [msg, account],
          });

          addLog('Generating Off-Chain ZK-SNARK & TEE Attestation...');
          addLog(`Shielded State Settled. Tx: ${txHash.slice(0,14)}...`);
          setStatusMsg('Payment Executed & Encrypted!');

          const tasks = ['AI Inference Escrow', 'Swarm Agent Settlement', 'LLM Vector Search Fee'];
          const randomTask = tasks[Math.floor(Math.random() * tasks.length)];

          const newTx = {
            id: txHash,
            timestamp: new Date().toLocaleTimeString(),
            txHash: txHash,
            contract: '0x71C9281A4a982E12f94119A8',
            encryptedPayload: '0x' + Array.from({ length: 48 }, () => Math.floor(Math.random() * 16).toString(16)).join(''),
            decryptedAmount: '0.0001 SEIS',
            gasUsed: '21000',
            task: randomTask,
            proofTime: (Math.random() * 40 + 190).toFixed(1) + 'ms'
          };

          setTransactions(prev => [newTx, ...prev]);

        } catch (err) {
          addLog('Transaction Aborted by Agent User.');
          setStatusMsg('Transaction Cancelled');
        } finally {
          setIsProcessing(false);
        }
      };

      return (
        <div style={{ padding: '2rem', maxWidth: '1400px', margin: '0 auto' }}>
          
          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #21262d', paddingBottom: '1.2rem', marginBottom: '1.5rem' }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <span className="pulse"></span>
                <h1 style={{ color: '#f0f6fc', margin: 0, fontSize: '1.5rem', letterSpacing: '1px' }}>SEISMIC <span style={{ color: '#539bf5' }}>// SHIELDED AGENT MESH</span></h1>
                <span className="badge" style={{ backgroundColor: '#1f6feb22', color: '#539bf5', border: '1px solid #1f6feb' }}>CHAIN ID: 5124</span>
              </div>
              <p style={{ color: '#768390', margin: '0.4rem 0 0 0', fontSize: '0.85rem' }}>
                Privacy-Preserving AI Agent Micropayments via Zero-Knowledge Encrypted State Architecture
              </p>
            </div>

            <div style={{ display: 'flex', gap: '1rem' }}>
              <button onClick={connectWallet} className="btn" style={{ backgroundColor: account ? '#161b22' : '#238636', border: '1px solid #30363d', color: '#fff' }}>
                {account ? `Agent: ${account.slice(0, 6)}...${account.slice(-4)}` : 'Connect Wallet'}
              </button>

              <button 
                onClick={() => {
                  setViewingKeyActive(!viewingKeyActive);
                  addLog(`Viewing Key status: ${!viewingKeyActive ? 'ACTIVE (Decrypted)' : 'OFF (Encrypted)'}`);
                }}
                className={`btn ${viewingKeyActive ? 'btn-key-active' : 'btn-key'}`}
              >
                {viewingKeyActive ? '🔓 Viewing Key: ACTIVE' : '🔒 Viewing Key: OFF'}
              </button>
            </div>
          </div>

          {/* Guide Steps */}
          <div style={{ display: 'flex', gap: '1rem', marginBottom: '1.5rem' }}>
            <div className={`guide-step ${account && transactions.length === 0 ? 'active' : ''}`}>
              <strong>Step 1: Trigger Agent Payment</strong>
              <div style={{ fontSize: '0.75rem', opacity: 0.8 }}>Executes an encrypted micro-transaction on Seismic Testnet.</div>
            </div>
            <div className={`guide-step ${transactions.length > 0 && !viewingKeyActive ? 'active' : ''}`}>
              <strong>Step 2: Inspect Public Observer Panel</strong>
              <div style={{ fontSize: '0.75rem', opacity: 0.8 }}>Observe how public nodes only see raw encrypted hex data.</div>
            </div>
            <div className={`guide-step ${transactions.length > 0 && viewingKeyActive ? 'active' : ''}`}>
              <strong>Step 3: Activate Viewing Key</strong>
              <div style={{ fontSize: '0.75rem', opacity: 0.8 }}>Unlocks off-chain ZK decryption for authorized agent state.</div>
            </div>
          </div>

          {/* Action Bar */}
          <div className="card" style={{ marginBottom: '1.5rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '1.5rem' }}>
              <button 
                onClick={executeTx} 
                disabled={isProcessing || !account}
                className="btn btn-primary"
                style={{ opacity: account ? 1 : 0.5, cursor: account ? 'pointer' : 'not-allowed', fontSize: '1rem' }}
              >
                {isProcessing ? '⏳ Computing ZK Proof...' : '⚡ Trigger Agent Payment (0.0001 SEIS)'}
              </button>
              <div>
                <div style={{ fontSize: '0.75rem', color: '#768390', textTransform: 'uppercase' }}>Terminal Status</div>
                <div style={{ color: '#539bf5', fontWeight: 'bold', fontSize: '0.95rem' }}>{statusMsg}</div>
              </div>
            </div>

            <div style={{ textAlign: 'right', fontSize: '0.8rem', color: '#768390' }}>
              <div>Network Target: <span style={{ color: '#f0f6fc' }}>Seismic Testnet L1</span></div>
              <div>RPC Endpoint: <span style={{ color: '#3fb950' }}>testnet-1.seismictest.net</span></div>
            </div>
          </div>

          {/* Dual Console */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.5rem', marginBottom: '1.5rem' }}>
            
            {/* Left: Public Observer */}
            <div className="card">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', borderBottom: '1px solid #21262d', paddingBottom: '0.6rem' }}>
                <h3 style={{ color: '#f0f6fc', margin: 0, fontSize: '1rem' }}>🌐 Public Observer State (On-Chain)</h3>
                <span className="badge" style={{ backgroundColor: '#d2992222', color: '#d29922', border: '1px solid #d29922' }}>Encrypted Payload</span>
              </div>
              <p style={{ color: '#768390', fontSize: '0.8rem', marginTop: 0 }}>
                What external observers or public block explorers see on the network.
              </p>

              {transactions.length === 0 ? (
                <div style={{ border: '1px dashed #30363d', borderRadius: '6px', padding: '3rem 1rem', textAlign: 'center', color: '#484f58', fontSize: '0.85rem' }}>
                  No telemetry captured. Click "Trigger Agent Payment" to generate on-chain activity.
                </div>
              ) : (
                transactions.map(tx => (
                  <div key={tx.id} style={{ background: '#161b22', border: '1px solid #30363d', borderRadius: '6px', padding: '1rem', marginBottom: '1rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: '#768390', marginBottom: '0.4rem' }}>
                      <span>Tx Hash: {tx.txHash.slice(0, 16)}...</span>
                      <span>[{tx.timestamp}]</span>
                    </div>
                    <div className="code-block" style={{ marginBottom: '0.5rem' }}>
                      {tx.encryptedPayload} <br/><span style={{ color: '#da3633', fontWeight: 'bold' }}>[SHIELDED STATE - AMOUNT & TASK HIDDEN]</span>
                    </div>
                    <div style={{ fontSize: '0.75rem', color: '#768390', display: 'flex', justifyContent: 'space-between' }}>
                      <span>Target Contract: {tx.contract}...</span>
                      <span>Gas: {tx.gasUsed}</span>
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* Right: Authorized Agent State */}
            <div className={`card ${viewingKeyActive ? 'card-active' : ''}`}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', borderBottom: '1px solid #21262d', paddingBottom: '0.6rem' }}>
                <h3 style={{ color: '#f0f6fc', margin: 0, fontSize: '1rem' }}>🔑 Authorized Agent State (Viewing Key)</h3>
                <span className="badge" style={{ backgroundColor: viewingKeyActive ? '#23863622' : '#da363322', color: viewingKeyActive ? '#3fb950' : '#f85149', border: `1px solid ${viewingKeyActive ? '#238636' : '#da3633'}` }}>
                  {viewingKeyActive ? 'ZK Decrypted' : 'Key Required'}
                </span>
              </div>
              <p style={{ color: '#768390', fontSize: '0.8rem', marginTop: 0 }}>
                Decrypted state metrics using off-chain Zero-Knowledge Verification.
              </p>

              {transactions.length === 0 ? (
                <div style={{ border: '1px dashed #30363d', borderRadius: '6px', padding: '3rem 1rem', textAlign: 'center', color: '#484f58', fontSize: '0.85rem' }}>
                  Awaiting payment execution to verify off-chain state.
                </div>
              ) : (
                transactions.map(tx => (
                  <div key={tx.id} style={{ background: '#161b22', border: `1px solid ${viewingKeyActive ? '#2e6930' : '#30363d'}`, borderRadius: '6px', padding: '1rem', marginBottom: '1rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', marginBottom: '0.5rem' }}>
                      <span style={{ color: '#539bf5', fontWeight: 'bold' }}>{tx.task}</span>
                      <span style={{ color: '#3fb950', fontSize: '0.75rem' }}>ZK Proof: {tx.proofTime}</span>
                    </div>
                    
                    <div style={{ background: '#0d1117', padding: '0.8rem', borderRadius: '4px', border: '1px solid #21262d', marginBottom: '0.6rem' }}>
                      <div style={{ fontSize: '0.75rem', color: '#768390' }}>Decrypted Transfer Amount:</div>
                      <div style={{ color: viewingKeyActive ? '#3fb950' : '#f85149', fontSize: '1.1rem', fontWeight: 'bold', margin: '0.2rem 0' }}>
                        {viewingKeyActive ? tx.decryptedAmount : '🔒 ACCESS DENIED (Toggle Viewing Key)'}
                      </div>
                    </div>

                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.75rem' }}>
                      <span style={{ color: viewingKeyActive ? '#3fb950' : '#da3633' }}>
                        {viewingKeyActive ? '✓ Valid ZK Proof Verified' : '✗ Viewing Key Inactive'}
                      </span>
                      <a 
                        href={`https://seismic-testnet.socialscan.io/tx/${tx.txHash}`} 
                        target="_blank" 
                        rel="noreferrer" 
                        style={{ color: '#539bf5', textDecoration: 'none' }}
                      >
                        SocialScan Explorer ↗
                      </a>
                    </div>
                  </div>
                ))
              )}
            </div>

          </div>

          {/* System Logs */}
          <div className="card" style={{ background: '#080c14' }}>
            <div style={{ fontSize: '0.8rem', color: '#768390', borderBottom: '1px solid #21262d', paddingBottom: '0.4rem', marginBottom: '0.6rem', display: 'flex', justifyContent: 'space-between' }}>
              <span>SYSTEM LOGS // REAL-TIME ZK TELEMETRY</span>
              <span style={{ color: '#3fb950' }}>● STREAM ACTIVE</span>
            </div>
            <div style={{ fontSize: '0.75rem', fontFamily: 'monospace', color: '#adbac7', display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
              {logs.map((log, index) => (
                <div key={index} style={{ opacity: 1 - index * 0.12 }}>{log}</div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
