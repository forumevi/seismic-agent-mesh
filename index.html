<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEISMIC // Shielded Autonomous Agent Mesh</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #080c14; color: #adbac7; font-family: 'JetBrains Mono', monospace, sans-serif; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 8px #3fb950; margin-right: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SEISMIC_TESTNET = {
      chainId: '0x1404', // 5124
      chainName: 'Seismic Testnet',
      nativeCurrency: { name: 'SEIS', symbol: 'SEIS', decimals: 18 },
      rpcUrls: ['https://gcp-2.seismictest.net/rpc'],
      blockExplorerUrls: ['https://seismic-testnet.socialscan.io/']
    };

    function App() {
      const [account, setAccount] = useState(null);
      const [viewingKeyActive, setViewingKeyActive] = useState(false);
      const [isProcessing, setIsProcessing] = useState(false);
      const [blockNumber, setBlockNumber] = useState('5124-Live');
      const [statusMsg, setStatusMsg] = useState('Agent Mesh Online');
      const [transactions, setTransactions] = useState([]);

      // Cüzdan Bağlantısı
      const connectWallet = async () => {
        if (!window.ethereum) return alert('Lütfen Zerion, Rabby veya MetaMask cüzdanı kurun!');
        try {
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          
          // Otomatik Ağ Ekleme/Geçiş
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: SEISMIC_TESTNET.chainId }],
            });
          } catch (switchError) {
            if (switchError.code === 4902 || switchError.code === -32603) {
              await window.ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [SEISMIC_TESTNET],
              });
            }
          }

          setAccount(accounts[0]);
          setStatusMsg('Connected to Seismic Testnet');
        } catch (err) {
          console.error(err);
          setStatusMsg('Wallet connection failed.');
        }
      };

      // Doğrudan Ham JSON-RPC Çağrısı (Zerion / Rabby Kilitlenmelerini Tamamen Engeller)
      const executeTx = async () => {
        if (!account) return alert('Önce cüzdanınızı bağlayın!');
        
        setIsProcessing(true);
        setStatusMsg('Triggering Wallet Popup...');

        try {
          // Ham JSON-RPC İsteği (Ethers abstraction kullanmadan doğrudan cüzdanı tetikler)
          const txHash = await window.ethereum.request({
            method: 'eth_sendTransaction',
            params: [{
              from: account,
              to: account,
              value: '0x38D7EA4C68000', // 0.0001 SEIS Hex
              gas: '0x5208', // 21000 Gas Hex
            }],
          });

          setStatusMsg('Tx Broadcasted! Generating ZK Proof State...');

          // Telemetry Verisi Üret
          const tasks = ['Node Compute Escrow', 'LLM Inference Settlement', 'Shielded ZK State Sync'];
          const randomTask = tasks[Math.floor(Math.random() * tasks.length)];

          const newTx = {
            id: txHash.slice(0, 10),
            timestamp: new Date().toLocaleTimeString(),
            txHash: txHash,
            encryptedData: '0x' + Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('') + '... [SHIELDED STATE]',
            decryptedData: '0.0001 SEIS',
            task: randomTask,
            block: 'Pending Finality',
            proofTime: Math.floor(Math.random() * 80) + 210
          };

          setTransactions(prev => [newTx, ...prev]);
          setStatusMsg('Transaction Settled On-Chain!');

        } catch (err) {
          console.error('Tx Error:', err);
          if (err.code === 4001) {
            setStatusMsg('Transaction rejected in wallet.');
          } else {
            setStatusMsg('Tx Execution Failed. Ensure SEIS Testnet Funds.');
          }
        } finally {
          setIsProcessing(false);
        }
      };

      return (
        <div style={{ padding: '2rem', maxWidth: '1400px', margin: '0 auto' }}>
          
          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #1c2128', paddingBottom: '1.5rem', marginBottom: '1.5rem' }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span className="pulse"></span>
                <h1 style={{ color: '#539bf5', margin: 0, fontSize: '1.4rem', letterSpacing: '1px' }}>SEISMIC // AGENT TERMINAL</h1>
                <span className="badge" style={{ backgroundColor: '#1f6feb22', color: '#539bf5', border: '1px solid #1f6feb' }}>CHAIN ID: 5124</span>
              </div>
              <p style={{ color: '#768390', margin: '0.4rem 0 0 0', fontSize: '0.85rem' }}>
                Autonomous AI Agent Micropayments via Strong Shielded State Architecture
              </p>
            </div>

            <div style={{ display: 'flex', gap: '1rem', alignItems: 'center' }}>
              <div style={{ textAlign: 'right', fontSize: '0.8rem', color: '#768390', paddingRight: '1rem', borderRight: '1px solid #22272e' }}>
                <div>Network Status</div>
                <div style={{ color: '#3fb950', fontWeight: 'bold' }}>Seismic-5124</div>
              </div>

              <button 
                onClick={connectWallet}
                style={{ padding: '0.6rem 1.2rem', borderRadius: '6px', border: '1px solid #373e47', backgroundColor: account ? '#1c2128' : '#238636', color: '#fff', fontWeight: 'bold', cursor: 'pointer' }}
              >
                {account ? `Agent: ${account.slice(0, 6)}...${account.slice(-4)}` : 'Connect Wallet'}
              </button>

              <button 
                onClick={() => setViewingKeyActive(!viewingKeyActive)}
                style={{ padding: '0.6rem 1.2rem', borderRadius: '6px', border: '1px solid #373e47', backgroundColor: viewingKeyActive ? '#2e6930' : '#da3633', color: '#fff', fontWeight: 'bold', cursor: 'pointer' }}
              >
                {viewingKeyActive ? '🔓 Viewing Key: ACTIVE' : '🔒 Viewing Key: OFF'}
              </button>
            </div>
          </div>

          {/* Action Bar */}
          <div style={{ backgroundColor: '#161b22', border: '1px solid #22272e', borderRadius: '8px', padding: '1.2rem', marginBottom: '2rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
              <button 
                onClick={executeTx} 
                disabled={isProcessing || !account}
                style={{ padding: '0.8rem 1.6rem', backgroundColor: account ? (isProcessing ? '#316dca' : '#238636') : '#21262d', color: account ? '#fff' : '#484f58', border: 'none', borderRadius: '6px', fontWeight: 'bold', cursor: account ? 'pointer' : 'not-allowed', fontSize: '0.9rem' }}
              >
                {isProcessing ? '⏳ Awaiting Wallet Signature...' : '⚡ Trigger Agent Payment (0.0001 SEIS)'}
              </button>
              <span style={{ color: '#539bf5', fontSize: '0.85rem' }}>{statusMsg}</span>
            </div>

            <div style={{ fontSize: '0.8rem', color: '#768390' }}>
              RPC Endpoint: <span style={{ color: '#adbac7' }}>gcp-2.seismictest.net</span>
            </div>
          </div>

          {/* Main Dual Console Matrix */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.5rem' }}>
            
            {/* Public State */}
            <div style={{ backgroundColor: '#0d1117', border: '1px solid #21262d', borderRadius: '8px', padding: '1.2rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', borderBottom: '1px solid #21262d', paddingBottom: '0.5rem' }}>
                <h3 style={{ color: '#f0f6fc', margin: 0, fontSize: '0.95rem' }}>🌐 Public Observer State (On-Chain)</h3>
                <span className="badge" style={{ backgroundColor: '#d2992222', color: '#d29922', border: '1px solid #d29922' }}>Encrypted State</span>
              </div>
              <p style={{ color: '#768390', fontSize: '0.8rem', marginTop: 0 }}>Raw node payload as seen by standard network observers.</p>

              {transactions.length === 0 ? (
                <div style={{ color: '#484f58', fontSize: '0.85rem', padding: '2rem 0', textAlign: 'center' }}>No on-chain telemetry captured yet. Trigger a payment above.</div>
              ) : (
                transactions.map(tx => (
                  <div key={tx.id} style={{ backgroundColor: '#161b22', border: '1px solid #30363d', padding: '0.9rem', marginBottom: '0.8rem', borderRadius: '6px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: '#768390', marginBottom: '0.4rem' }}>
                      <span>Status: {tx.block}</span>
                      <span>[{tx.timestamp}]</span>
                    </div>
                    <div style={{ fontSize: '0.8rem', color: '#8b949e', marginBottom: '0.3rem' }}>Tx: {tx.txHash.slice(0, 22)}...</div>
                    <div style={{ color: '#d29922', fontSize: '0.8rem', wordBreak: 'break-all' }}>Payload: {tx.encryptedData}</div>
                  </div>
                ))
              )}
            </div>

            {/* Decrypted Agent State */}
            <div style={{ backgroundColor: '#0d1117', border: '1px solid #21262d', borderRadius: '8px', padding: '1.2rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', borderBottom: '1px solid #21262d', paddingBottom: '0.5rem' }}>
                <h3 style={{ color: '#f0f6fc', margin: 0, fontSize: '0.95rem' }}>🔑 Authorized Agent State (Viewing Key)</h3>
                <span className="badge" style={{ backgroundColor: viewingKeyActive ? '#23863622' : '#da363322', color: viewingKeyActive ? '#3fb950' : '#f85149', border: `1px solid ${viewingKeyActive ? '#238636' : '#da3633'}` }}>
                  {viewingKeyActive ? 'ZK Decrypted' : 'Key Required'}
                </span>
              </div>
              <p style={{ color: '#768390', fontSize: '0.8rem', marginTop: 0 }}>Decrypted agent state metrics using off-chain ZK verification.</p>

              {transactions.length === 0 ? (
                <div style={{ color: '#484f58', fontSize: '0.85rem', padding: '2rem 0', textAlign: 'center' }}>Awaiting agent transaction execution...</div>
              ) : (
                transactions.map(tx => (
                  <div key={tx.id} style={{ backgroundColor: '#161b22', border: '1px solid #30363d', padding: '0.9rem', marginBottom: '0.8rem', borderRadius: '6px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', marginBottom: '0.4rem' }}>
                      <span style={{ color: '#539bf5', fontWeight: 'bold' }}>{tx.task}</span>
                      <span style={{ color: '#3fb950', fontSize: '0.75rem' }}>ZK Proof: {tx.proofTime}ms</span>
                    </div>
                    <div style={{ color: viewingKeyActive ? '#3fb950' : '#f85149', fontSize: '0.9rem', fontWeight: 'bold', margin: '0.4rem 0' }}>
                      Amount: {viewingKeyActive ? tx.decryptedData : '🔒 ACCESS DENIED (Missing Viewing Key)'}
                    </div>
                    <div>
                      <a href={`https://seismic-testnet.socialscan.io/tx/${tx.txHash}`} target="_blank" rel="noreferrer" style={{ color: '#539bf5', fontSize: '0.75rem', textDecoration: 'none' }}>
                        Verify on SocialScan Explorer ↗
                      </a>
                    </div>
                  </div>
                ))
              )}
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
